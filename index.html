
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COIN HUNTER</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            background: #101827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: gold;
            margin: 12px;
        }

        #score {
            color: #42d392;
            font-size: 23px;
            font-weight: bold;
            margin: 15px;
        }

        #game {
            position: relative;
            width: min(95vw, 400px);
            height: 500px;
            margin: auto;
            background: #193c31;
            border: 3px solid #42d392;
            border-radius: 12px;
            overflow: hidden;
        }

        #player {
            position: absolute;
            width: 40px;
            height: 65px;
            left: 180px;
            top: 220px;
            z-index: 2;
            font-size: 48px;
            line-height: 65px;
            user-select: none;
        }

        #coin {
            position: absolute;
            width: 35px;
            height: 35px;
            left: 100px;
            top: 100px;
            font-size: 32px;
            line-height: 35px;
            animation: spin 1s infinite alternate;
            user-select: none;
        }

        @keyframes spin {
            from {
                transform: scaleX(0.5);
            }
            to {
                transform: scaleX(1);
            }
        }

        .controls {
            margin-top: 12px;
        }

        button {
            background: #2388ff;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px 25px;
            font-size: 22px;
            margin: 5px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.93);
        }

        #finish {
            background: #20a66a;
            width: min(95%, 400px);
            margin-top: 18px;
            font-weight: bold;
        }

        #finish:disabled {
            background: #777;
        }
    </style>
</head>

<body>

    <h1>🪙 COIN HUNTER</h1>

    <div id="score">
        Монеты: 0 | Баллы: 0
    </div>

    <div id="game">
        <div id="coin">🪙</div>
        <div id="player">🧍</div>
    </div>

    <div class="controls">
        <button onclick="move('up')">⬆️</button>
    </div>

    <div class="controls">
        <button onclick="move('left')">⬅️</button>
        <button onclick="move('down')">⬇️</button>
        <button onclick="move('right')">➡️</button>
    </div>

    <button id="finish" onclick="finishGame()">
        🏁 ЗАВЕРШИТЬ ИГРУ
    </button>

    <script>

        // =========================
        // TELEGRAM
        // =========================

        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        // =========================
        // ЭЛЕМЕНТЫ ИГРЫ
        // =========================

        const playerElement = document.getElementById("player");
        const coinElement = document.getElementById("coin");
        const scoreElement = document.getElementById("score");
        const finishButton = document.getElementById("finish");

        let player = {
            x: 180,
            y: 220
        };

        let coin = {
            x: 100,
            y: 100
        };

        let score = 0;
        let gameFinished = false;

        // =========================
        // ОБНОВЛЕНИЕ ЭКРАНА
        // =========================

        function updateScreen() {

            playerElement.style.left = player.x + "px";
            playerElement.style.top = player.y + "px";

            coinElement.style.left = coin.x + "px";
            coinElement.style.top = coin.y + "px";

            scoreElement.innerText =
                "Монеты: " + score +
                " | Баллы: " + score;
        }

        // =========================
        // НОВАЯ МОНЕТКА
        // =========================

        function newCoin() {

            coin.x = Math.floor(Math.random() * 330) + 10;
            coin.y = Math.floor(Math.random() * 420) + 10;

            updateScreen();
        }

        // =========================
        // ДВИЖЕНИЕ ИГРОКА
        // =========================

        function move(direction) {

            if (gameFinished) return;

            if (direction === "up") player.y -= 25;
            if (direction === "down") player.y += 25;
            if (direction === "left") player.x -= 25;
            if (direction === "right") player.x += 25;

            player.x = Math.max(0, Math.min(350, player.x));
            player.y = Math.max(0, Math.min(430, player.y));

            const playerCenterX = player.x + 20;
            const playerCenterY = player.y + 32;

            const coinCenterX = coin.x + 17;
            const coinCenterY = coin.y + 17;

            const distanceX = Math.abs(
                playerCenterX - coinCenterX
            );

            const distanceY = Math.abs(
                playerCenterY - coinCenterY
            );

            if (distanceX < 30 && distanceY < 35) {

                score++;

                newCoin();
            }

            updateScreen();
        }

        // =========================
        // УПРАВЛЕНИЕ КЛАВИАТУРОЙ
        // =========================

        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowUp") move("up");
            if (event.key === "ArrowDown") move("down");
            if (event.key === "ArrowLeft") move("left");
            if (event.key === "ArrowRight") move("right");

        });

        // =========================
        // ЗАВЕРШЕНИЕ ИГРЫ
        // =========================

        function finishGame() {

            if (gameFinished) return;

            if (!tg || typeof tg.sendData !== "function") {

                alert("Не удалось подключиться к Telegram!");

                return;
            }

            const result = {
                action: "finish_game",
                score: Number(score)
            };

            try {

                gameFinished = true;
                finishButton.disabled = true;

                tg.sendData(JSON.stringify(result));

            } catch (error) {

                gameFinished = false;
                finishButton.disabled = false;

                alert(
                    "Ошибка отправки результата: " +
                    error.message
                );
            }
        }

        // =========================
        // ЗАПУСК ИГРЫ
        // =========================

        updateScreen();

    </script>

</body>
</html>
