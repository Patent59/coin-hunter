
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Hunter</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            background: #101827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: gold;
        }

        #score {
            font-size: 25px;
            margin: 15px;
            color: #42d392;
        }

        canvas {
            background: #193c31;
            border: 3px solid #42d392;
            border-radius: 12px;
            width: min(95vw, 400px);
            height: auto;
            touch-action: none;
        }

        button {
            background: #2388ff;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px 25px;
            font-size: 20px;
            margin: 8px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.95);
        }

        #finish {
            background: #20a66a;
            width: min(95%, 400px);
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🪙 COIN HUNTER</h1>

    <div id="score">Монеты: 0 | Баллы: 0</div>

    <canvas id="game" width="400" height="500"></canvas>

    <div>
        <button onclick="move('up')">⬆️</button>
    </div>

    <div>
        <button onclick="move('left')">⬅️</button>
        <button onclick="move('down')">⬇️</button>
        <button onclick="move('right')">➡️</button>
    </div>

    <button id="finish" onclick="finishGame()">
        🏁 ЗАВЕРШИТЬ ИГРУ
    </
