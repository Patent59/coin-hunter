
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Hunter</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: gold;
        }

        #score {
            font-size: 25px;
            margin: 15px;
        }

        canvas {
            background: #193c31;
            border: 3px solid #42d392;
            border-radius: 12px;
            width: min(95vw, 400px);
            height: auto;
            touch-action: none;
        }

        button {
            background: #2388ff;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px 25px;
            font-size: 20px;
            margin: 8px;
        }
    </style>
</head>
<body>

    <h1>🪙 COIN HUNTER</h1>

    <div id="score">Монеты: 0</div>

    <canvas id="game" width="400" height="500"></canvas>

    <div>
        <button onclick="move('up')">⬆️</button>
    </div>
    <div>
        <button onclick="move('left')">⬅️</button>
        <button onclick="move('down')">⬇️</button>
        <button onclick="move('right')">➡️</button>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        let player = { x: 190, y: 240, size: 25 };
        let coin = { x: 100, y: 100 };
        let score = 0;

        function draw() {
            ctx.clearRect(0, 0, 400, 500);

            ctx.font = "28px Arial";
            ctx.fillText("🪙", coin.x, coin.y);

            ctx.font = "30px Arial";
            ctx.fillText("🧍", player.x, player.y);

            document.getElementById("score").innerText =
                "Монеты: " + score;
        }

        function move(direction) {
            if (direction === "up") player.y -= 25;
            if (direction === "down") player.y += 25;
            if (direction === "left") player.x -= 25;
            if (direction === "right") player.x += 25;

            player.x = Math.max(0, Math.min(370, player.x));
            player.y = Math.max(30, Math.min(470, player.y));

            if (
                Math.abs(player.x - coin.x) < 30 &&
                Math.abs(player.y - coin.y) < 35
            ) {
                score++;
                coin.x = Math.floor(Math.random() * 350) + 20;
                coin.y = Math.floor(Math.random() * 430) + 30;
            }

            draw();
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp") move("up");
            if (e.key === "ArrowDown") move("down");
            if (e.key === "ArrowLeft") move("left");
            if (e.key === "ArrowRight") move("right");
        });

        draw();
    </script>

</body>
</html>
